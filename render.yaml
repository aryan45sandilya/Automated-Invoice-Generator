services:
  # Web Service
  - type: web
    name: invoicehub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invoicehub-db
          property: connectionString
      - key: DEBUG
        value: False

  # PostgreSQL Database
  - type: pserv
    name: invoicehub-db
    runtime: postgresql
    plan: free
    ipAllowList: []
