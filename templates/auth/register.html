{% extends "base.html" %}

{% block title %}Register - Invoice Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 style="color: #1e293b; font-weight: 800;"><i class="bi bi-receipt" style="color: #6366f1;"></i> InvoiceHub</h2>
                    <p style="color: #64748b;">Create your account</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label" style="color: #1e293b; font-weight: 600;">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label" style="color: #1e293b; font-weight: 600;">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label" style="color: #1e293b; font-weight: 600;">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        <small style="color: #94a3b8;">Minimum 6 characters</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label" style="color: #1e293b; font-weight: 600;">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                    
                    <div class="text-center">
                        <p class="mb-0" style="color: #64748b;">Already have an account? <a href="{{ url_for('auth.login') }}" style="color: #6366f1; font-weight: 600;">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
