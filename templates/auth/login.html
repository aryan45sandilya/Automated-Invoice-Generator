{% extends "base.html" %}

{% block title %}Login - Invoice Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 style="color: #1e293b; font-weight: 800;"><i class="bi bi-receipt" style="color: #6366f1;"></i> InvoiceHub</h2>
                    <p style="color: #64748b;">Sign in to your account</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label" style="color: #1e293b; font-weight: 600;">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label" style="color: #1e293b; font-weight: 600;">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember" style="color: #64748b;">Remember me</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                    
                    <div class="text-center">
                        <p class="mb-0" style="color: #64748b;">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #6366f1; font-weight: 600;">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <small style="color: #94a3b8;">© 2026 InvoiceHub. Professional Invoice Management System</small>
        </div>
    </div>
</div>
{% endblock %}
